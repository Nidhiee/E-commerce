$kind: http-request
name: Get Cart
description: |-
  Returns the cart, creating an empty one if none exists.
method: GET
url: "{{baseUrl}}/api/cart"
order: 1000
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
