$kind: http-request
name: Add To Cart
description: |-
  Adds the product, or increases its quantity if already in the cart. Fails with 400 if stock is insufficient.
method: POST
url: "{{baseUrl}}/api/cart"
order: 2000
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "quantity": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });
