$kind: http-request
name: Get My Orders
method: GET
url: "{{baseUrl}}/api/orders/myorders"
order: 2000
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
