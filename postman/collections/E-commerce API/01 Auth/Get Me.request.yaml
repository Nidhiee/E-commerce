$kind: http-request
name: Get Me
description: |-
  Returns the logged-in user's profile.
method: GET
url: "{{baseUrl}}/api/auth/me"
order: 3000
headers:
  Authorization: Bearer {{accessToken}}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
