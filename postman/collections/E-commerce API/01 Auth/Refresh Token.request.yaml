$kind: http-request
name: Refresh Token
description: |-
  Uses the refreshToken cookie (Postman keeps it in its cookie jar after Login) to get a new access token. The old refresh token is revoked.
method: POST
url: "{{baseUrl}}/api/auth/refresh"
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.collectionVariables.set('accessToken', pm.response.json().accessToken);
