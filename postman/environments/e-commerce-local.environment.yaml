name: E-commerce Local
values:
  - key: baseUrl
    value: http://localhost:5000
    enabled: true

  # Throwaway test customer created by the Register request.
  - key: customerName
    value: Test Customer
    enabled: true
  - key: customerEmail
    value: customer@example.com
    enabled: true
  - key: customerPassword
    value: secret123
